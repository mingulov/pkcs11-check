# Third-party test vector sources — single source of truth.
# Run:    pkcs11-check fetch-data [name|all|--status]
# Update: change commit + archive_sha256, then re-fetch.
#
# license       — SPDX identifier (or LicenseRef-*) summarising the upstream
#                 license; see THIRD_PARTY_LICENSES.md for the full picture.
# license_files — paths inside the upstream repo (at `commit`) that document
#                 the license. Used by the fetch CLI to (a) construct a URL
#                 https://github.com/{repo}/blob/{commit}/{path} for display
#                 and (b) locate the on-disk license after extraction.

[wycheproof]
repo = "C2SP/wycheproof"
commit = "3fa63dd0344abb611f1fb1d77e119938603ea230"
commit_date = "2026-09-02T15:59:32Z"
archive_sha256 = "5dc00fae83575135c3147bfd4a04ee8889b1f0482ac6ca21aa486a8abccf2260"
description = "Wycheproof edge-case cryptographic test vectors"
include = ["testvectors_v1/", "LICENSE"]
license = "Apache-2.0"
license_files = ["LICENSE"]

