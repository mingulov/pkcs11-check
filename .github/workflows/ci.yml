name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  # Run the JS actions (checkout, setup-uv) on the runner's Node 24 instead of
  # the bundled Node 20 (deprecated). GitHub's documented opt-in; harmless once
  # Node 24 becomes the default (2026-06-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev
      - run: uv run mypy src/

  meta-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/ -v --timeout=60

  strict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev
      - run: uv run pytest --strict-markers src/pkcs11_check/testcases/ --collect-only -q

  smoke-softhsm2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v4
      - run: sudo apt-get update && sudo apt-get install -y softhsm2
      - run: uv sync --frozen --extra dev
      - name: Setup SoftHSM2 token
        run: |
          mkdir -p /tmp/pkcs11-check-tokens
          printf 'directories.tokendir = /tmp/pkcs11-check-tokens\nobjectstore.backend = file\n' > /tmp/softhsm2.conf
          export SOFTHSM2_CONF=/tmp/softhsm2.conf
          softhsm2-util --init-token --slot 0 --label pkcs11-check --so-pin 87654321 --pin 1234
      - name: Run smoke tests
        env:
          SOFTHSM2_CONF: /tmp/softhsm2.conf
        run: |
          # Functional smoke only: --marker "not security" excludes destructive
          # probes (e.g. isize::MAX ulDataLen boundary) that surface real
          # provider defects (documented in docs/module-issues.md) and are
          # exercised in the full Docker matrix, not this per-push gate.
          uv run pkcs11-check test \
            --module /usr/lib/softhsm/libsofthsm2.so \
            --pin 1234 \
            --timeout 60 \
            --isolation auto \
            --marker "not security" \
            --match "test_encrypt or test_sign or test_digest"
