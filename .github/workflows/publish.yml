name: Release

# Manual-only release: verify -> build -> tag -> PyPI -> GitHub Release.
#
# THE FILENAME IS LOAD-BEARING. PyPI Trusted Publishing binds to the dispatched
# workflow's filename, and PyPI does not support a reusable workflow as the
# registered publisher. Renaming this file breaks publishing until a matching
# publisher is added at
# https://pypi.org/manage/project/pkcs11-check/settings/publishing/ with:
#   Owner = mingulov, Repository = pkcs11-check,
#   Workflow name = publish.yml, Environment = pypi
#
# Publishing uses Trusted Publishing (OIDC); no API tokens are stored here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.9 (a leading 'v' is accepted)"
        required: true
        type: string
      dry_run:
        description: "Rehearse only: verify and build, do not tag, upload or release"
        required: false
        type: boolean
        default: true
      expected_sha:
        description: "Rehearsed main head SHA (required for production runs; dry runs omit it)"
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release state
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Require the rehearsed head SHA on production runs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: expected_sha not required."
            exit 0
          fi
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error::production runs require the rehearsed expected_sha input"
            exit 1
          fi
          if [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::expected_sha $EXPECTED_SHA != dispatched $GITHUB_SHA: main moved since rehearsal"
            exit 1
          fi
          echo "head $GITHUB_SHA matches the rehearsed SHA."

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Refuse to release from anywhere but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases run from main only, got $GITHUB_REF"
            exit 1
          fi

      - name: Normalize the requested version
        id: normalize
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check version consistency and extract the release notes
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
        run: python3 scripts/release_check.py --version "$VERSION" --notes-out release-notes.md

      - name: Check the lockfile is current
        run: uv lock --check

      - name: Refuse if the tag exists on another commit
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          tag="v$VERSION"
          existing_ref=$(git ls-remote --tags origin "refs/tags/$tag")
          existing=$(printf '%s\n' "$existing_ref" | awk '{print $1}')
          if [ -n "$existing" ]; then
            # Peel an annotated tag to the commit it actually points at.
            peeled_ref=$(git ls-remote --tags origin "refs/tags/$tag^{}")
            peeled=$(printf '%s\n' "$peeled_ref" | awk '{print $1}')
            target="${peeled:-$existing}"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists and points at $target, not $GITHUB_SHA"
              exit 1
            fi
            echo "$tag already points at this commit; a re-run will resume."
          fi

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in {1..12}; do
            run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" \
              --branch "$GITHUB_REF_NAME" --event push --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::no CI push run found for $GITHUB_SHA on $GITHUB_REF_NAME"
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 10

      - name: Warn if the changelog date is not today
        run: |
          today=$(date -u +%F)
          entry=$(grep -m1 -oP '^## \[[^]]+\] - \K\S+' CHANGELOG.md || echo "(unparsed)")
          if [ "$entry" != "$today" ]; then
            echo "::warning::CHANGELOG date is $entry, today is $today (UTC)"
          fi

      - name: Summarize what this run would do
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Release $VERSION"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- tag: \`v$VERSION\` (annotated)"
            echo "- dry run: \`$DRY_RUN\`"
            echo
            echo "#### Release notes"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

      - name: Record the gate binding for this run
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # R5-1: the post-publish gate binds its version to THIS record
          # (downloaded from the triggering run) instead of inferring from
          # tags or settling latest: exact version + explicit rehearsal bit.
          python3 - <<'PY'
          import json
          import os
          binding = {
              "version": os.environ["VERSION"],
              "dry_run": os.environ.get("DRY_RUN", "true") == "true",
              "sha": os.environ["GITHUB_SHA"],
          }
          with open("gate-binding.json", "w", encoding="utf-8") as handle:
              json.dump(binding, handle)
              handle.write("\n")
          print(f"gate binding: {binding['version']} dry_run={binding['dry_run']}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: gate-binding
          path: gate-binding.json
          if-no-files-found: error

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0

      - run: uv build

      - name: Assert the artifacts carry the released version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ls -lh dist/
          for artifact in "dist/pkcs11_check-$VERSION.tar.gz" \
                          "dist/pkcs11_check-$VERSION-py3-none-any.whl"; do
            if [ ! -f "$artifact" ]; then
              echo "::error::$artifact was not built"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  tag:
    name: Push the release tag
    needs: [verify, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push the annotated tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists and verify confirmed it points here; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "pkcs11-check $VERSION" "$GITHUB_SHA"
          git push origin "$tag"

  publish:
    name: Publish to PyPI
    needs: [verify, build, tag]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pkcs11-check
    permissions:
      id-token: write  # Trusted Publishing (OIDC); this job gets no other scope
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Makes a re-run after a later-step failure idempotent instead of fatal.
          skip-existing: true

  verify-pypi:
    name: Verify the published files
    needs: [verify, build, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist/

      - name: Await and verify the published files
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          SIMPLE_URL = "https://pypi.org/simple/pkcs11-check/"
          READ_TIMEOUT = 30
          WAIT_INTERVAL = 15
          WAIT_DEADLINE = 300

          version = os.environ["VERSION"]
          wheel_name = f"pkcs11_check-{version}-py3-none-any.whl"
          sdist_name = f"pkcs11_check-{version}.tar.gz"


          def simple_page() -> str:
              with urllib.request.urlopen(SIMPLE_URL, timeout=READ_TIMEOUT) as response:
                  return response.read().decode("utf-8", "replace")


          def file_hrefs(page: str) -> dict[str, str]:
              found: dict[str, str] = {}
              # Tolerate attributes between href and the link text: real
              # PyPI annotates links (data-requires-python), TestPyPI's
              # older pages do not. A strict `">` match finds nothing.
              for href, name in re.findall(r'href="([^"]+)"[^>]*>([^<>]+)<', page):
                  if name in (wheel_name, sdist_name):
                      found[name] = urllib.parse.urljoin(SIMPLE_URL, href)
              return found


          # The GitHub Release announces this version: only proceed once both
          # files are visible on the same simple index pip will read.
          deadline = time.monotonic() + WAIT_DEADLINE
          while True:
              try:
                  hrefs = file_hrefs(simple_page())
              except Exception as exc:
                  print(f"simple-index read failed ({exc}); retrying")
                  hrefs = {}
              if wheel_name in hrefs and sdist_name in hrefs:
                  print(f"wheel+sdist for {version} visible on PyPI")
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit(f"pkcs11-check {version} files not visible after {WAIT_DEADLINE}s")
              print(f"waiting for {version} files on PyPI ...")
              time.sleep(WAIT_INTERVAL)

          # The published bytes must equal the official local artifacts that
          # the release attaches: downloading also proves fetchability, not
          # just index presence.
          for name, href in hrefs.items():
              with urllib.request.urlopen(href, timeout=READ_TIMEOUT) as response:
                  published = response.read()
              official = Path("dist", name).read_bytes()
              if hashlib.sha256(published).hexdigest() != hashlib.sha256(official).hexdigest():
                  raise SystemExit(f"published {name} differs from the official artifact")
              print(f"{name}: {len(published)} bytes, hash matches")
          PY

  github-release:
    name: Publish the GitHub Release
    needs: [verify, publish, verify-pypi]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes/

      - name: Generate SHA256SUMS for the release assets
        run: |
          cd dist
          sha256sum pkcs11_check-*.tar.gz pkcs11_check-*-py3-none-any.whl > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            # `gh release view` also finds drafts: an interrupted first run
            # may have left the release published-but-incomplete (or an old
            # draft) without SHA256SUMS. A rerun must heal that, never bless
            # it: verify the assets, upload anything missing, publish a
            # leftover draft, and only then report success.
            echo "release $tag already exists; verifying its assets..."
            # Only `uploaded` assets count: an interrupted upload leaves a
            # named-but-`starter` asset that a name check alone would bless.
            assets="$(gh release view "$tag" --json assets \
              --jq '.assets[] | select(.state == "uploaded") | .name')"
            missing=0
            for file in dist/*; do
              name="$(basename "$file")"
              if ! printf '%s\n' "$assets" | grep -qxF "$name"; then
                echo "missing asset: $name"
                missing=1
              fi
            done
            if [ "$missing" -eq 0 ]; then
              echo "release $tag already exists with all assets; nothing to do."
            else
              echo "uploading missing assets to $tag..."
              gh release upload "$tag" dist/* --clobber
            fi
            # Outside the conditional: `set -e` does not fire inside
            # `[ ... ]`, so a failed lookup there would silently skip this.
            is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" = "true" ]; then
              echo "publishing draft $tag..."
              gh release edit "$tag" --draft=false
            fi
            exit 0
          fi
          gh release create "$tag" \
            --title "pkcs11-check $VERSION" \
            --notes-file notes/release-notes.md \
            dist/*
