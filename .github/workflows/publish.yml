name: Release

# Manual-only release: verify -> build -> tag -> PyPI -> GitHub Release.
#
# THE FILENAME IS LOAD-BEARING. PyPI Trusted Publishing binds to the dispatched
# workflow's filename, and PyPI does not support a reusable workflow as the
# registered publisher. Renaming this file breaks publishing until a matching
# publisher is added at
# https://pypi.org/manage/project/pkcs11-check/settings/publishing/ with:
#   Owner = mingulov, Repository = pkcs11-check,
#   Workflow name = publish.yml, Environment = pypi
#
# Publishing uses Trusted Publishing (OIDC); no API tokens are stored here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.9 (a leading 'v' is accepted)"
        required: true
        type: string
      dry_run:
        description: "Rehearse only: verify and build, do not tag, upload or release"
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release state
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Refuse to release from anywhere but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases run from main only, got $GITHUB_REF"
            exit 1
          fi

      - name: Normalize the requested version
        id: normalize
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check version consistency and extract the release notes
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
        run: python3 scripts/release_check.py --version "$VERSION" --notes-out release-notes.md

      - name: Check the lockfile is current
        run: uv lock --check

      - name: Refuse if the tag exists on another commit
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          tag="v$VERSION"
          existing_ref=$(git ls-remote --tags origin "refs/tags/$tag")
          existing=$(printf '%s\n' "$existing_ref" | awk '{print $1}')
          if [ -n "$existing" ]; then
            # Peel an annotated tag to the commit it actually points at.
            peeled_ref=$(git ls-remote --tags origin "refs/tags/$tag^{}")
            peeled=$(printf '%s\n' "$peeled_ref" | awk '{print $1}')
            target="${peeled:-$existing}"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists and points at $target, not $GITHUB_SHA"
              exit 1
            fi
            echo "$tag already points at this commit; a re-run will resume."
          fi

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > runs.json
          python3 - <<'PY'
          import json
          import os
          import sys

          with open("runs.json", encoding="utf-8") as handle:
              data = json.load(handle)

          this_run = int(os.environ["GITHUB_RUN_ID"])
          ci_runs = [
              run
              for run in data["workflow_runs"]
              if run["id"] != this_run and run["name"] == "CI"
          ]
          if not ci_runs:
              sys.exit("::error::no CI run found for this commit; push it and let CI finish")

          bad = [run for run in ci_runs if run["conclusion"] != "success"]
          for run in bad:
              print(f"::error::CI run {run['html_url']} is {run['status']}/{run['conclusion']}")
          sys.exit(1 if bad else 0)
          PY

      - name: Warn if the changelog date is not today
        run: |
          today=$(date -u +%F)
          entry=$(grep -m1 -oP '^## \[[^]]+\] - \K\S+' CHANGELOG.md || echo "(unparsed)")
          if [ "$entry" != "$today" ]; then
            echo "::warning::CHANGELOG date is $entry, today is $today (UTC)"
          fi

      - name: Summarize what this run would do
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Release $VERSION"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- tag: \`v$VERSION\` (annotated)"
            echo "- dry run: \`$DRY_RUN\`"
            echo
            echo "#### Release notes"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0

      - run: uv build

      - name: Assert the artifacts carry the released version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ls -lh dist/
          for artifact in "dist/pkcs11_check-$VERSION.tar.gz" \
                          "dist/pkcs11_check-$VERSION-py3-none-any.whl"; do
            if [ ! -f "$artifact" ]; then
              echo "::error::$artifact was not built"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  tag:
    name: Push the release tag
    needs: [verify, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push the annotated tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists and verify confirmed it points here; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "pkcs11-check $VERSION" "$GITHUB_SHA"
          git push origin "$tag"

  publish:
    name: Publish to PyPI
    needs: [verify, build, tag]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pkcs11-check
    permissions:
      id-token: write  # Trusted Publishing (OIDC); this job gets no other scope
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Makes a re-run after a later-step failure idempotent instead of fatal.
          skip-existing: true

  github-release:
    name: Publish the GitHub Release
    needs: [verify, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" \
            --title "pkcs11-check $VERSION" \
            --notes-file notes/release-notes.md \
            dist/*
