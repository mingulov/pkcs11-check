name: PyPI gate

# Permanent post-publish validation gate: after every TestPyPI or production
# PyPI publish, install the published wheel AND sdist from the published index
# into fresh interpreters on ubuntu/windows/macos and drive the installed
# package (never the source tree) through install -> version check ->
# entry points -> doctor -> fetch data -> smoke subset -> vector slice ->
# report. This automates the manual index-validation pass; the
# published-artifact assertions live in tests/test_published_artifact.py and
# the workflow contract in tests/test_pypi_gate_workflow.py.
#
# Triggers:
#   - workflow_run after the TestPyPI or Release workflow completes
#     successfully (the automatic "after every publish" legs; a dry_run
#     success re-validates whatever is latest on that index, harmless);
#   - workflow_dispatch / workflow_call with an optional pinned version and
#     index for manual re-runs. With no version the gate validates the
#     index's latest.
#
# Index handling: garbage fails first on every event; an explicit `index`
# input then wins everywhere (a reviewed caller passing one is attested by
# review); only an omitted input falls through to trigger attestation (a
# Release run validates production PyPI, a TestPyPI run validates TestPyPI)
# or the test default (bare manual calls). Anything else fails loudly in
# prepare -- the gate never guesses an index.
#
# Version handling: a `prepare` job resolves ONE version for the whole run
# and every matrix leg validates exactly that release. An explicitly
# requested version wins outright. An unpinned automatic run binds to the
# gate-binding record its publisher uploaded (exact version plus an
# explicit rehearsal bit -- a rehearsal validates latest, a publish
# validates its own version); anything missing or malformed stops the run
# with re-dispatch guidance instead of guessing. Settle-agreement ("latest"
# across consecutive identical reads) covers only unpinned manual runs:
# resolving per leg diverged within a single run (the JSON index is
# CDN-cached per runner, so one leg saw rc1 while others saw rc2), and
# installing immediately after upload raced index propagation (metadata
# visible before files are fetchable). The pinned version then awaits its
# release files on the simple index before the matrix is released (instant
# for already-published releases). Prepare's wait ran on one runner's CDN
# edge, so each validate leg additionally awaits the pinned files on ITS
# OWN index view before installing (up to 5 minutes): otherwise a stale
# edge fails pip resolution after a green prepare.
#
# Install handling: pip consults every configured index without preferring
# --index-url, so a version hosted on both indexes could install bytes from
# the wrong one while the version check still passes. The await loop
# therefore resolves both file hrefs with one tolerant expression and
# retains this leg's URL as a step output; install hands pip that URL blind
# (wheel and sdist legs differ by file, not by pip flags). Dependencies
# resolve from production PyPI only, with ambient extra indexes emptied.
#
# This workflow never publishes, tags, or releases anything: it is read-only
# (contents: read for the checkout) plus installs from the gate index.

on:
  workflow_run:
    workflows: ["TestPyPI", "Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to validate on the gate index (default: latest on that index)"
        required: false
        type: string
      index:
        description: "Package index to validate"
        required: false
        type: choice
        options: [test, prod]
        default: test
  workflow_call:
    inputs:
      version:
        description: "Version to validate on the gate index (default: latest on that index)"
        required: false
        type: string
      index:
        description: "Package index to validate: test (TestPyPI) or prod (PyPI)"
        required: false
        type: string

permissions:
  contents: read
  # R5-1: download the gate-binding record from the triggering publish run.
  # Still read-only: no writes, no tags, no releases, no OIDC publishing.
  actions: read

jobs:
  prepare:
    # Same leg gate as validate: without it a failed publish would still run
    # a pointless settle-and-wait here while validate stays skipped.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      index: ${{ steps.candidate.outputs.index }}
      simple_url: ${{ steps.candidate.outputs.simple_url }}
    steps:
      - name: Resolve and await candidate version
        id: candidate
        env:
          REQUESTED: ${{ inputs.version }}
          REQUESTED_INDEX: ${{ inputs.index }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import time
          import urllib.request
          import zipfile

          READ_TIMEOUT = 30
          SETTLE_READS = 3
          SETTLE_INTERVAL = 15
          SETTLE_DEADLINE = 300
          WAIT_INTERVAL = 15
          WAIT_DEADLINE = 600

          # The index is attested, never guessed. Garbage fails first, on
          # every event; an explicit input then wins everywhere (a reviewed
          # caller passing one is attested by review, so a reusable call
          # from a workflow_run-triggered caller keeps its explicit index
          # instead of being overridden). Only an omitted input falls
          # through to trigger attestation (automatic runs) or the test
          # default (bare manual calls; the dispatch UI always sends one).
          event = os.environ.get("EVENT_NAME", "")
          triggering = os.environ.get("TRIGGERING_WORKFLOW", "")
          requested_index = os.environ.get("REQUESTED_INDEX", "").strip()
          if requested_index not in ("", "test", "prod"):
              raise SystemExit(f"index must be 'test' or 'prod', got {requested_index!r}")
          if requested_index in ("test", "prod"):
              index = requested_index
          elif event == "workflow_run":
              if triggering == "Release":
                  index = "prod"
              elif triggering == "TestPyPI":
                  index = "test"
              else:
                  raise SystemExit(f"unexpected triggering workflow: {triggering!r}")
          else:
              index = "test"
          host = "pypi.org" if index == "prod" else "test.pypi.org"
          JSON_URL = f"https://{host}/pypi/pkcs11-check/json"
          SIMPLE_URL = f"https://{host}/simple/pkcs11-check/"
          print(f"gate index: {index} ({host})")


          def read_latest() -> str:
              with urllib.request.urlopen(JSON_URL, timeout=READ_TIMEOUT) as response:
                  return str(json.load(response)["info"]["version"])


          def simple_page() -> str:
              with urllib.request.urlopen(SIMPLE_URL, timeout=READ_TIMEOUT) as response:
                  return response.read().decode("utf-8", "replace")


          def triggering_binding() -> dict[str, object]:
              """Version + rehearsal bit recorded by the triggering publish run.

              R5-1: both publishers upload a gate-binding record, so the gate
              binds to attested data instead of inferring from tags or
              settling latest (settle-agreement could freeze on a stale edge
              and green-light the previous release). Anything missing or
              malformed stops the run with re-dispatch guidance: runs from
              before the binding existed (or with expired artifacts) are
              re-validated explicitly, never guessed.
              """
              api_root = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              run_id = os.environ.get("TRIGGERING_RUN_ID", "")
              token = os.environ.get("GITHUB_TOKEN", "")
              if not repo or not run_id or not token:
                  raise SystemExit(
                      "cannot bind gate version: missing repository, run id, or token; "
                      "re-dispatch with an explicit version"
                  )
              listing_url = f"{api_root}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"

              def api_read(url: str) -> bytes:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=READ_TIMEOUT) as response:
                          return response.read()
                  except Exception as exc:
                      raise SystemExit(
                          f"cannot bind gate version: artifact API failed ({exc}); "
                          "re-dispatch with an explicit version"
                      )

              try:
                  listing = json.loads(api_read(listing_url))
                  matches = [
                      item
                      for item in listing.get("artifacts", [])
                      if item.get("name") == "gate-binding" and not item.get("expired", False)
                  ]
                  if len(matches) != 1:
                      raise SystemExit(
                          "cannot bind gate version: no live gate-binding artifact on "
                          f"run {run_id} (pre-binding run or expired?); "
                          "re-dispatch with an explicit version"
                      )
                  blob = api_read(matches[0]["archive_download_url"])
                  binding = json.loads(zipfile.ZipFile(io.BytesIO(blob)).read("gate-binding.json"))
                  version_text = binding.get("version", "")
                  if not isinstance(version_text, str) or not version_text.strip():
                      raise SystemExit(
                          "cannot bind gate version: binding has no version; "
                          "re-dispatch with an explicit version"
                      )
                  return {"version": version_text.strip(), "dry_run": bool(binding.get("dry_run", False))}
              except SystemExit:
                  raise
              except Exception as exc:
                  raise SystemExit(
                      f"cannot bind gate version: malformed binding ({exc}); "
                      "re-dispatch with an explicit version"
                  )


          requested = os.environ.get("REQUESTED", "").strip()
          trigger_index = {"Release": "prod", "TestPyPI": "test"}.get(triggering)
          use_binding = (
              not requested
              and event == "workflow_run"
              and trigger_index is not None
              and index == trigger_index
          )
          if requested:
              version = requested
              print(f"requested version: {version}")
          elif use_binding:
              binding = triggering_binding()
              if binding["dry_run"]:
                  version = ""
                  print("triggering run was a rehearsal: validating latest")
              else:
                  version = str(binding["version"])
                  print(f"bound to triggering publish: {version}")
          else:
              if (
                  not requested
                  and event == "workflow_run"
                  and trigger_index is not None
                  and index != trigger_index
              ):
                  print(
                      f"index {index} differs from triggering {triggering}; "
                      "settling on the selected index instead of binding"
                  )
              version = ""
          if not version:
              # "Latest" is CDN-cached per runner: consecutive identical reads
              # prove the value settled instead of trusting one stale read.
              seen: list[str] = []
              deadline = time.monotonic() + SETTLE_DEADLINE
              while True:
                  try:
                      latest = read_latest()
                  except Exception as exc:
                      print(f"latest read failed ({exc}); retrying")
                      latest = ""
                  seen.append(latest)
                  print(f"latest reads: {seen[-SETTLE_READS:]}")
                  if (
                      latest
                      and len(seen) >= SETTLE_READS
                      and len(set(seen[-SETTLE_READS:])) == 1
                  ):
                      version = latest
                      break
                  if time.monotonic() >= deadline:
                      raise SystemExit(f"latest on {host} did not settle in time")
                  time.sleep(SETTLE_INTERVAL)
              print(f"settled on latest: {version}")

          # Metadata turns visible before files are fetchable: await both
          # release files on the same simple index pip will read.
          wheel_marker = f"-{version}-"
          sdist_marker = f"-{version}.tar.gz"
          deadline = time.monotonic() + WAIT_DEADLINE
          while True:
              try:
                  page = simple_page()
              except Exception as exc:
                  print(f"simple-index read failed ({exc}); retrying")
                  page = ""
              if wheel_marker in page and sdist_marker in page:
                  print(f"wheel+sdist for {version} visible on the simple index")
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit(f"pkcs11-check {version} files not visible after {WAIT_DEADLINE}s")
              print(f"waiting for {version} files ...")
              time.sleep(WAIT_INTERVAL)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")
              handle.write(f"index={index}\n")
              handle.write(f"simple_url={SIMPLE_URL}\n")
          print(f"Validating pkcs11-check {version} from {host} on every leg")
          PY

  validate:
    # Only the automatic leg is gated: a failed/cancelled publish run has no
    # new artifacts to validate. Manual legs always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        artifact: [wheel, sdist]
    defaults:
      run:
        # One shell for every step on every OS (git-bash on windows-latest) so
        # the install/check/fetch/smoke sequence is written once; only the
        # Windows SoftHSM provisioning below overrides this with pwsh.
        shell: bash
    steps:
      - name: Checkout framework (gate tests + helpers)
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Oldest supported interpreter (requires-python >=3.12) is the
          # strictest install target, so the gate pins it on every OS.
          python-version: "3.12"

      - name: Await version on this runner's index
        id: await
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SIMPLE_URL: ${{ needs.prepare.outputs.simple_url }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          SIMPLE_URL = os.environ["SIMPLE_URL"]
          READ_TIMEOUT = 30
          WAIT_INTERVAL = 15
          WAIT_DEADLINE = 300

          version = os.environ["VERSION"]
          artifact = os.environ["ARTIFACT"]
          wheel_name = f"pkcs11_check-{version}-py3-none-any.whl"
          sdist_name = f"pkcs11_check-{version}.tar.gz"
          if artifact == "wheel":
              wanted = wheel_name
          elif artifact == "sdist":
              wanted = sdist_name
          else:
              raise SystemExit(f"unknown gate artifact: {artifact!r}")

          # R3-2: one read, one parser. The wait and the install used to read
          # the page separately with different matchers (substring markers vs
          # a double-quote-only regex): a transient error on the second read,
          # or valid single-quoted links, broke the leg after the wait passed.
          # The loop resolves both hrefs with one tolerant expression and
          # retains this leg's URL as a step output; install consumes it blind.
          # R4-3: whitespace around `=` is valid HTML (a strict match would
          # time out on it), and a resolved URL only counts when it is HTTPS
          # and its filename is exactly the wanted file -- otherwise a
          # whitespace-href decoy with the right link text would pass the
          # wait and hand pip the index page itself.
          LINK_RE = re.compile(r"""href\s*=\s*(["'])([^"']+)\1[^>]*>([^<>]+)<""")


          def page_hrefs(page: str) -> dict[str, str]:
              found: dict[str, str] = {}
              for _quote, href, name in LINK_RE.findall(page):
                  if name not in (wheel_name, sdist_name):
                      continue
                  resolved = urllib.parse.urljoin(SIMPLE_URL, href)
                  parts = urllib.parse.urlparse(resolved)
                  if parts.scheme != "https":
                      continue
                  if parts.path.rsplit("/", 1)[-1] != name:
                      continue
                  found[name] = resolved
              return found


          # Prepare's wait ran on another runner's CDN edge: this leg must see
          # the pinned release files on ITS OWN index view before pip does,
          # or resolution fails with "No matching distribution" (run 44460105408
          # attempt 1: prepare green, ubuntu wheel leg red on 0.3.0rc5).
          deadline = time.monotonic() + WAIT_DEADLINE
          while True:
              try:
                  with urllib.request.urlopen(SIMPLE_URL, timeout=READ_TIMEOUT) as response:
                      page = response.read().decode("utf-8", "replace")
                  hrefs = page_hrefs(page)
              except Exception as exc:
                  print(f"simple-index read failed ({exc}); retrying")
                  hrefs = {}
              if wheel_name in hrefs and sdist_name in hrefs:
                  print(f"wheel+sdist for {version} visible from this runner")
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit(f"pkcs11-check {version} files not visible after {WAIT_DEADLINE}s")
              print(f"waiting for {version} files on this runner's index ...")
              time.sleep(WAIT_INTERVAL)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"artifact_url={hrefs[wanted]}\n")
          PY

      - name: Install ${{ matrix.artifact }} from the pinned index
        env:
          ARTIFACT_URL: ${{ steps.await.outputs.artifact_url }}
          # R3-3: pip merges an inherited PIP_EXTRA_INDEX_URL alongside the
          # explicit index; empty it so dependencies resolve from prod PyPI
          # only, never from ambient runner configuration.
          PIP_EXTRA_INDEX_URL: ""
        run: |
          # The URL was resolved from the pinned simple page inside the await
          # loop (single read, single parser): no second index read here
          # means no second failure point. The artifact legs differ by file
          # (wheel vs sdist URL), never by pip flags. R4-2: point pip at an
          # empty config so a pip.conf extra index cannot join either (the
          # null device is spelled per-OS; --isolated does not cover files).
          PIP_CONFIG_FILE="$(python -c 'import os; print(os.devnull)')" \
            python -m pip install \
            --index-url https://pypi.org/simple/ \
            "$ARTIFACT_URL"
          python -m pip show pkcs11-check

      - name: Version check
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(pkcs11-check version | tr -d '\r')" = "pkcs11-check $VERSION"
          python - <<'PY'
          import os
          import pkcs11_check
          assert pkcs11_check.__version__ == os.environ["VERSION"], pkcs11_check.__version__
          assert "site-packages" in pkcs11_check.__file__, pkcs11_check.__file__
          print("import OK:", pkcs11_check.__version__, "from", pkcs11_check.__file__)
          PY

      - name: Entry-point check
        run: |
          python - <<'PY'
          import importlib
          from importlib.metadata import entry_points
          pytest11 = {e.name: e.value for e in entry_points(group="pytest11")}
          assert pytest11.get("pkcs11-check") == "pkcs11_check.plugin", pytest11
          scripts = {e.name for e in entry_points(group="console_scripts")}
          assert {"pkcs11-check", "pkcs11-check-report"} <= scripts, scripts
          plugin = importlib.import_module("pkcs11_check.plugin")
          assert callable(plugin.pytest_addoption) and callable(plugin.pytest_configure)
          print("entry points OK")
          PY

      - name: Published-artifact meta-tests
        env:
          # Strict mode: missing dist metadata fails instead of skipping —
          # a gate install always has metadata, so a skip would mask breakage.
          PKCS11_CHECK_GATE_STRICT: "1"
        run: |
          # Run from outside the checkout against the installed package: the
          # runner resolves the test path to a native absolute path first
          # (git-bash /d/... paths are not valid for native Windows python).
          TEST_FILE=$(python -c "import os; print(os.path.abspath('tests/test_published_artifact.py'))" | tr -d '\r')
          cd "$RUNNER_TEMP"
          python -m pytest "$TEST_FILE" -q

      - name: Install SoftHSM2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y softhsm2
          CONF="$GITHUB_WORKSPACE/gate-softhsm.conf"
          mkdir -p "$GITHUB_WORKSPACE/gate-tokens"
          printf 'directories.tokendir = %s/gate-tokens\nobjectstore.backend = file\n' "$GITHUB_WORKSPACE" > "$CONF"
          export SOFTHSM2_CONF="$CONF"
          softhsm2-util --init-token --slot 0 --label pkcs11-check --so-pin 87654321 --pin 1234
          {
            echo "SOFTHSM2_CONF=$CONF"
            echo "P11_MODULE=/usr/lib/softhsm/libsofthsm2.so"
            echo "P11_SLOT=0"
            echo "P11_PIN=1234"
          } >> "$GITHUB_ENV"

      - name: Install SoftHSM2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install softhsm
          MODULE="$(brew --prefix)/lib/softhsm/libsofthsm2.so"
          if [ ! -f "$MODULE" ]; then MODULE="$(brew --prefix)/lib/softhsm/libsofthsm2.dylib"; fi
          if [ ! -f "$MODULE" ]; then MODULE="$(find "$(brew --prefix)" -name 'libsofthsm2.*' | head -n1)"; fi
          CONF="$GITHUB_WORKSPACE/gate-softhsm.conf"
          mkdir -p "$GITHUB_WORKSPACE/gate-tokens"
          printf 'directories.tokendir = %s/gate-tokens\nobjectstore.backend = file\nlog.level = ERROR\n' "$GITHUB_WORKSPACE" > "$CONF"
          export SOFTHSM2_CONF="$CONF"
          softhsm2-util --init-token --slot 0 --label pkcs11-check --so-pin 87654321 --pin 1234
          {
            echo "SOFTHSM2_CONF=$CONF"
            echo "P11_MODULE=$MODULE"
            echo "P11_SLOT=0"
            echo "P11_PIN=1234"
          } >> "$GITHUB_ENV"
          echo "Resolved module: $MODULE"

      - name: Install SoftHSM2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/disig/SoftHSM2-for-Windows/releases/download/v2.5.0/SoftHSM2-2.5.0-portable.zip'
          $sha = '85273bcc1a6b90e877f7bb4f7e90221d57103d8f5241d154a79dd730a135b910'
          Invoke-WebRequest -Uri $url -OutFile sh2.zip
          if ((Get-FileHash sh2.zip -Algorithm SHA256).Hash -ne $sha) { throw 'SoftHSM2 sha256 mismatch' }
          Expand-Archive -Path sh2.zip -DestinationPath sh2 -Force
          # Forward slashes: consumed by git-bash steps below, valid for Win32.
          $module = ("$PWD/sh2/SoftHSM2/lib/softhsm2-x64.dll").Replace('\', '/')
          if (!(Test-Path $module)) { throw "SoftHSM2 module not found: $module" }
          $conf = "$PWD/gate-softhsm.conf"
          New-Item -ItemType Directory -Force gate-tokens | Out-Null
          "directories.tokendir = $PWD/gate-tokens`nobjectstore.backend = file`nlog.level = ERROR" |
            Set-Content -Path $conf -Encoding ascii
          $env:SOFTHSM2_CONF = $conf
          python scripts/init_softhsm2_token.py "$module" pkcs11-check 1234 87654321
          "P11_MODULE=$module" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOFTHSM2_CONF=$conf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "P11_SLOT=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "P11_PIN=1234" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: doctor (pre-fetch)
        run: |
          pkcs11-check info --module "$P11_MODULE"
          pkcs11-check doctor --module "$P11_MODULE" --slot "$P11_SLOT" --pin "$P11_PIN"

      - name: Fetch vectors
        run: |
          # Native absolute data dir (git-bash /d/... paths are not valid for
          # native Windows python); every later step inherits it via the env.
          DATA_DIR="$(python -c 'import os; print(os.path.abspath("gate-data"))' | tr -d '\r')"
          pkcs11-check fetch-data all --data-dir "$DATA_DIR"
          pkcs11-check fetch-data --status --data-dir "$DATA_DIR"
          printf '%s\n' "PKCS11_CHECK_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

      - name: doctor (post-fetch)
        run: |
          pkcs11-check doctor --module "$P11_MODULE" --slot "$P11_SLOT" --pin "$P11_PIN"

      - name: Smoke (installed package)
        run: |
          mkdir -p gate-out/smoke gate-out/vectors
          pkcs11-check test \
            --module "$P11_MODULE" --slot "$P11_SLOT" --pin "$P11_PIN" \
            --timeout 120 --isolation auto --marker "not security" \
            --match "test_encrypt or test_sign or test_digest" \
            --output json --output-file gate-out/smoke/results.json
          python - gate-out/smoke/results.json <<'PY'
          import json
          import sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))["summary"]
          assert summary["total"] > 0 and summary["passed"] > 0, summary
          assert summary["failed"] == 0, summary
          assert summary.get("crashed", 0) == 0 and summary.get("error", 0) == 0, summary
          print("smoke summary OK:", {k: summary[k] for k in ("passed", "failed", "skipped", "xfailed", "total")})
          PY

      - name: Vector slice (fetch-then-test proof)
        run: |
          pkcs11-check test \
            --module "$P11_MODULE" --slot "$P11_SLOT" --pin "$P11_PIN" \
            --timeout 120 --isolation auto \
            --match "test_hmac_wycheproof and sha512 and tc1" \
            --output json --output-file gate-out/vectors/results.json
          python - gate-out/vectors/results.json <<'PY'
          import json
          import sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))["summary"]
          # Fetched bytes are really consumed: the slice must EXECUTE vectors.
          assert summary["passed"] > 0, summary
          assert summary["failed"] == 0, summary
          print("vector slice OK:", {k: summary[k] for k in ("passed", "failed", "skipped", "xfailed", "total")})
          PY

      - name: Report
        run: |
          pkcs11-check-report --report-log gate-out/smoke/report.jsonl \
            --results-json gate-out/smoke/results.json \
            --provider softhsm2 --out gate-out/report
          ls gate-out gate-out/report

      - name: Summarize
        if: always()
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          INDEX: ${{ needs.prepare.outputs.index }}
        run: |
          python - "gate-out/smoke/results.json" "gate-out/vectors/results.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import sys
          # ${{ matrix.artifact }} is substituted by GitHub before bash runs.
          leg = f"{os.environ.get('INDEX', '?')} {os.environ.get('RUNNER_OS', '?')} ${{ matrix.artifact }}"
          try:
              smoke = json.load(open(sys.argv[1], encoding="utf-8")).get("summary", {})
              vec = json.load(open(sys.argv[2], encoding="utf-8")).get("summary", {})
              print(f"### pkcs11-check {os.environ['VERSION']} ({leg}): "
                    f"smoke {smoke.get('passed', 0)}/{smoke.get('total', 0)} passed, "
                    f"{smoke.get('failed', 0)} failed, {smoke.get('xfailed', 0)} xfailed; "
                    f"vector slice {vec.get('passed', 0)}/{vec.get('total', 0)} passed, "
                    f"{vec.get('failed', 0)} failed")
          except Exception as e:  # noqa: BLE001
              print(f"### pkcs11-check {os.environ.get('VERSION', '?')} ({leg}): no JSON report ({e})")
          PY

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pypi-gate-${{ needs.prepare.outputs.index }}-${{ matrix.os }}-${{ matrix.artifact }}
          path: gate-out/
          if-no-files-found: warn
