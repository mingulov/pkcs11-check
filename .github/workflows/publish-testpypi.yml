name: TestPyPI

# Manual-only package rehearsal: verify -> build -> optional TestPyPI upload.
#
# TestPyPI Trusted Publishing must be configured separately from production PyPI with:
#   Owner = mingulov, Repository = pkcs11-check,
#   Workflow name = publish-testpypi.yml, Environment = testpypi
#
# This workflow never tags a commit or creates a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Canonical candidate version X.Y.ZrcN, e.g. 0.1.9rc1"
        required: true
        type: string
      dry_run:
        description: "Build only; untick to upload the artifacts to TestPyPI"
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: testpypi
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the TestPyPI state
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      base_version: ${{ steps.candidate.outputs.base_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Refuse to publish from anywhere but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::TestPyPI runs publish from main only, got $GITHUB_REF"
            exit 1
          fi

      - name: Validate the requested candidate
        id: candidate
        env:
          CANDIDATE: ${{ inputs.version }}
        run: |
          if [[ ! "$CANDIDATE" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)rc[1-9][0-9]*$ ]]; then
            echo "::error::candidate must be canonical X.Y.ZrcN, for example 0.1.9rc1"
            exit 1
          fi
          echo "version=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "base_version=${CANDIDATE%%rc*}" >> "$GITHUB_OUTPUT"

      - name: Check stable version consistency
        env:
          VERSION: ${{ steps.candidate.outputs.base_version }}
        run: python3 scripts/release_check.py --version "$VERSION"

      - name: Check the lockfile is current
        run: uv lock --check

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in {1..12}; do
            run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" \
              --branch "$GITHUB_REF_NAME" --event push --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::no CI push run found for $GITHUB_SHA on $GITHUB_REF_NAME"
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 10

      - name: Summarize what this run would do
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### TestPyPI $VERSION"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- dry run: \`$DRY_RUN\`"
            echo "- destination: \`https://test.pypi.org/p/pkcs11-check\`"
            echo
            echo "This workflow does not create a tag or GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0

      - name: Stage the TestPyPI candidate
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          BASE_VERSION: ${{ needs.verify.outputs.base_version }}
        run: |
          path=src/pkcs11_check/__init__.py
          stable="__version__ = \"$BASE_VERSION\""
          if ! grep -Fqx "$stable" "$path"; then
            echo "::error::$path does not contain the expected stable version"
            exit 1
          fi
          sed -i "s/^__version__ = \"$BASE_VERSION\"$/__version__ = \"$VERSION\"/" "$path"
          grep -Fqx "__version__ = \"$VERSION\"" "$path"

      - run: uv build

      - name: Assert the artifacts carry the requested version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ls -lh dist/
          for artifact in "dist/pkcs11_check-$VERSION.tar.gz" \
                          "dist/pkcs11_check-$VERSION-py3-none-any.whl"; do
            if [ ! -f "$artifact" ]; then
              echo "::error::$artifact was not built"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to TestPyPI
    needs: [verify, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pkcs11-check
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
