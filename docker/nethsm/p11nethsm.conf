# nethsm-pkcs11 config. The module logs in as the operator by default and auto-escalates
# to the administrator only for actions that need it (e.g. C_GenerateKeyPair) — so the suite
# can generate keys in-process. Server is co-located over loopback; self-signed cert accepted
# (the container has no external network, so this is safe in the lab).
slots:
  - label: "pkcs11-check"
    operator:
      username: "operator"
      password: "opPassphrase1"
    administrator:
      username: "admin"
      password: "Administrator1"
    instances:
      - url: "https://127.0.0.1:8443/api/v1"
        danger_insecure_cert: true
