---
# Docker Compose for pkcs11-check multi-module testing
#
# Versioned releases:
#   docker compose -f docker/docker-compose.test.yml run test-softhsm2
#   docker compose -f docker/docker-compose.test.yml run test-kryoptic
#   docker compose -f docker/docker-compose.test.yml run test-nss
#   docker compose -f docker/docker-compose.test.yml run test-nss-pqc
#   docker compose -f docker/docker-compose.test.yml run test-opencryptoki
#   docker compose -f docker/docker-compose.test.yml run test-wolfpkcs11
#   docker compose -f docker/docker-compose.test.yml run test-corepkcs11
#
# Development branches (latest from main):
#   docker compose -f docker/docker-compose.test.yml run test-softhsm2-main
#   docker compose -f docker/docker-compose.test.yml run test-kryoptic-main
#   docker compose -f docker/docker-compose.test.yml run test-kryoptic-fips
#   docker compose -f docker/docker-compose.test.yml run test-wolfpkcs11-master
#   docker compose -f docker/docker-compose.test.yml run test-corepkcs11-main
#
# Additional/experimental:
#   docker compose -f docker/docker-compose.test.yml run test-tpm2
#   docker compose -f docker/docker-compose.test.yml run test-bouncyhsm
#   docker compose -f docker/docker-compose.test.yml run test-optee-pkcs11
#   docker compose -f docker/docker-compose.test.yml run test-optee-pkcs11-master
#   docker compose -f docker/docker-compose.test.yml run test-pkcs11-mock

x-common: &common
  volumes:
    - ../artifacts:/artifacts
    - ${PKCS11_CHECK_HOST_DATA_DIR:-../data}:/app/data:ro
    - ../data/disabled-tests.txt:/app/disabled-tests.txt:ro

services:

  # ==========================================================
  # Versioned releases — stable, reproducible
  # ==========================================================

  # SoftHSM2 2.7.0 (v2.40, OpenSSL 3.6.2)
  test-softhsm2:
    <<: *common
    build:
      context: ..
      dockerfile: docker/softhsm2/Dockerfile.main
      args:
        OPENSSL_VERSION: "${OPENSSL_VERSION:-3.6.2}"
        SOFTHSM2_REF: "2.7.0"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/softhsm2
      PKCS11_CHECK_PIN: "1234"

  # SoftHSM2 2.7.0 with pkcs11-check generated-IV simulator patch
  test-softhsm2-generated-iv:
    <<: *common
    build:
      context: ..
      dockerfile: docker/softhsm2/Dockerfile.main
      args:
        OPENSSL_VERSION: "${OPENSSL_VERSION:-3.6.2}"
        SOFTHSM2_REF: "2.7.0"
        SOFTHSM2_APPLY_GENERATED_IV_PATCH: "1"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/softhsm2-generated-iv
      PKCS11_CHECK_PIN: "1234"

  # Kryoptic v1.5.1 (v3.2, Rust, OpenSSL 4.0.0)
  test-kryoptic:
    <<: *common
    build:
      context: ..
      dockerfile: docker/kryoptic/Dockerfile.main
      args:
        OPENSSL_TAG: "${OPENSSL_TAG:-openssl-4.0.0}"
        KRYOPTIC_REF: "v1.5.1"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/kryoptic
      PKCS11_CHECK_PIN: "1234"

  # NSS stable (Fedora 44, v3.0)
  test-nss:
    <<: *common
    build:
      context: ..
      dockerfile: docker/nss-softoken/Dockerfile
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/nss

  # NSS stable, slot 0 (Internal Cryptographic Services) — second pass covering the
  # digest/hash/bulk-cipher mechanisms NSS advertises only on slot 0 (the default
  # slot-1 cert/key-DB pass does not). Same image; slot overridden at runtime.
  # See docs/module-issues.md "Slot architecture".
  test-nss-slot0:
    <<: *common
    build:
      context: ..
      dockerfile: docker/nss-softoken/Dockerfile
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/nss-slot0
      PKCS11_CHECK_SLOT: "0"

  # NSS PQC/source release (official NSS/NSPR RTM tags)
  test-nss-pqc:
    <<: *common
    build:
      context: ..
      dockerfile: docker/nss-softoken/Dockerfile.rawhide
      args:
        NSS_TAG: "${NSS_TAG:-NSS_3_124_RTM}"
        NSPR_TAG: "${NSPR_TAG:-NSPR_4_39_RTM}"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/nss-pqc

  # NSS PQC, slot 0 (Internal Cryptographic Services) — second pass (see test-nss-slot0).
  test-nss-pqc-slot0:
    <<: *common
    build:
      context: ..
      dockerfile: docker/nss-softoken/Dockerfile.rawhide
      args:
        NSS_TAG: "${NSS_TAG:-NSS_3_124_RTM}"
        NSPR_TAG: "${NSPR_TAG:-NSPR_4_39_RTM}"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/nss-pqc-slot0
      PKCS11_CHECK_SLOT: "0"

  # OpenCryptoki 3.27.0 (IBM, v3.0, OpenSSL 4.0.0)
  test-opencryptoki:
    <<: *common
    build:
      context: ..
      dockerfile: docker/opencryptoki/Dockerfile.master
      args:
        OPENSSL_VERSION: "${OPENSSL_VERSION:-4.0.0}"
        OPENCRYPTOKI_REPO: "https://github.com/opencryptoki/opencryptoki.git"
        OPENCRYPTOKI_BRANCH: "v3.27.0"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/opencryptoki
      PKCS11_CHECK_PIN: "1234"

  # wolfPKCS11 v2.0.0-stable with latest stable wolfSSL
  test-wolfpkcs11:
    <<: *common
    build:
      context: ..
      dockerfile: docker/wolfpkcs11/Dockerfile
      args:
        WOLFSSL_REF: "v5.9.1-stable"
        WOLFPKCS11_REF: "v2.0.0-stable"
        WOLFPKCS11_ENABLE_PQC: "0"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/wolfpkcs11
      PKCS11_CHECK_PIN: "1234"
      PKCS11_CHECK_SLOT: "0"

  # corePKCS11 v3.6.4 (FreeRTOS MbedTLS software mock, v2.40 subset)
  test-corepkcs11:
    <<: *common
    build:
      context: ..
      dockerfile: docker/corepkcs11/Dockerfile
      args:
        COREPKCS11_REF: "v3.6.4"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/corepkcs11
      PKCS11_CHECK_MODULE: /usr/local/lib/libcorepkcs11_adapter.so
      PKCS11_CHECK_PIN: "0000"
      PKCS11_CHECK_SLOT: "0"

  # ==========================================================
  # Development branches — bleeding edge, may break
  # ==========================================================

  # OpenCryptoki master branch (built from source + custom OpenSSL)
  test-opencryptoki-master:
    <<: *common
    build:
      context: ..
      dockerfile: docker/opencryptoki/Dockerfile.master
      args:
        OPENSSL_VERSION: "${OPENSSL_VERSION:-4.0.0}"
        OPENCRYPTOKI_REPO: "${OPENCRYPTOKI_REPO:-https://github.com/opencryptoki/opencryptoki.git}"
        OPENCRYPTOKI_BRANCH: "${OPENCRYPTOKI_BRANCH:-master}"
        OPENCRYPTOKI_PR: "${OPENCRYPTOKI_PR:-}"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/opencryptoki-master
      PKCS11_CHECK_PIN: "1234"

  # corePKCS11 main branch (FreeRTOS MbedTLS software mock, v2.40 subset)
  test-corepkcs11-main:
    <<: *common
    build:
      context: ..
      dockerfile: docker/corepkcs11/Dockerfile
      args:
        COREPKCS11_REF: "main"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/corepkcs11-main
      PKCS11_CHECK_MODULE: /usr/local/lib/libcorepkcs11_adapter.so
      PKCS11_CHECK_PIN: "0000"
      PKCS11_CHECK_SLOT: "0"

  # NSS main branch (source tip, full PQC)
  test-nss-main:
    <<: *common
    build:
      context: ..
      dockerfile: docker/nss-softoken/Dockerfile.main
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/nss-main

  # NSS main, slot 0 (Internal Cryptographic Services) — second pass (see test-nss-slot0).
  test-nss-main-slot0:
    <<: *common
    build:
      context: ..
      dockerfile: docker/nss-softoken/Dockerfile.main
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/nss-main-slot0
      PKCS11_CHECK_SLOT: "0"

  # SoftHSM2 main branch (latest development + custom OpenSSL)
  test-softhsm2-main:
    <<: *common
    build:
      context: ..
      dockerfile: docker/softhsm2/Dockerfile.main
      args:
        OPENSSL_VERSION: "${OPENSSL_VERSION:-4.0.0}"
        SOFTHSM2_REF: "main"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/softhsm2-main
      PKCS11_CHECK_PIN: "1234"

  # Kryoptic main branch (latest dev, default features)
  # Custom OpenSSL: OPENSSL_TAG=openssl-3.6.2 bash docker/test.sh kryoptic-main --rebuild
  test-kryoptic-main:
    <<: *common
    build:
      context: ..
      dockerfile: docker/kryoptic/Dockerfile.main
      args:
        OPENSSL_TAG: "${OPENSSL_TAG:-openssl-4.0.0}"
        KRYOPTIC_REF: "main"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/kryoptic-main
      PKCS11_CHECK_PIN: "1234"

  # Kryoptic FIPS (main + simo5/openssl kryoptic_ossl40, --features fips,pqc)
  # Based on: github.com/parallaxsecond/rust-cryptoki/pull/362
  test-kryoptic-fips:
    <<: *common
    build:
      context: ..
      dockerfile: docker/kryoptic/Dockerfile.fips
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/kryoptic-fips
      PKCS11_CHECK_PIN: "12345678"

  # wolfPKCS11 master with wolfSSL master, PKCS#11 v3.2, ML-DSA, and ML-KEM
  test-wolfpkcs11-master:
    <<: *common
    build:
      context: ..
      dockerfile: docker/wolfpkcs11/Dockerfile
      args:
        WOLFSSL_REF: "master"
        WOLFPKCS11_REF: "master"
        WOLFPKCS11_ENABLE_PQC: "1"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/wolfpkcs11-master
      PKCS11_CHECK_INTERFACE: "3.2"
      PKCS11_CHECK_PIN: "1234"
      PKCS11_CHECK_SLOT: "0"

  # ==========================================================
  # Additional implementations
  # ==========================================================

  # OP-TEE PKCS#11 TA 4.10.0 (QEMU v8 guest, v2.40)
  test-optee-pkcs11:
    <<: *common
    build:
      context: ..
      dockerfile: docker/optee-pkcs11/Dockerfile
      args:
        OPTEE_REF: "4.10.0"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/optee-pkcs11
      PKCS11_CHECK_MODULE: /usr/lib/libckteec.so
      PKCS11_CHECK_INTERFACE: "2.40"
      PKCS11_CHECK_PIN: "1234"
      PKCS11_CHECK_SO_PIN: "87654321"
      PKCS11_CHECK_SLOT: "0"

  # OP-TEE PKCS#11 TA master branch (QEMU v8 guest, v2.40)
  test-optee-pkcs11-master:
    <<: *common
    build:
      context: ..
      dockerfile: docker/optee-pkcs11/Dockerfile
      args:
        OPTEE_REF: "master"
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/optee-pkcs11-master
      PKCS11_CHECK_MODULE: /usr/lib/libckteec.so
      PKCS11_CHECK_INTERFACE: "2.40"
      PKCS11_CHECK_PIN: "1234"
      PKCS11_CHECK_SO_PIN: "87654321"
      PKCS11_CHECK_SLOT: "0"

  # tpm2-pkcs11 with swtpm + tpm2-abrmd
  test-tpm2:
    <<: *common
    build:
      context: ..
      dockerfile: docker/tpm2-pkcs11/Dockerfile
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/tpm2
      PKCS11_CHECK_PIN: "1234"

  # BouncyHSM (.NET/BouncyCastle, v3.2, 206 mechanisms)
  test-bouncyhsm:
    <<: *common
    build:
      context: ..
      dockerfile: docker/bouncyhsm/Dockerfile
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/bouncyhsm
      PKCS11_CHECK_PIN: "1234"

  # pkcs11-mock — minimal v3.1 stub
  test-pkcs11-mock:
    <<: *common
    build:
      context: ..
      dockerfile: docker/pkcs11-mock/Dockerfile
    environment:
      PKCS11_CHECK_ARTIFACT_DIR: /artifacts/pkcs11-mock
