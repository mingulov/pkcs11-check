---
# Docker Compose for p11test multi-module testing
#
# Usage:
#   docker compose -f docker/docker-compose.test.yml build
#   docker compose -f docker/docker-compose.test.yml run test-softhsm2
#   docker compose -f docker/docker-compose.test.yml run test-kryoptic
#   docker compose -f docker/docker-compose.test.yml run test-nss
#   docker compose -f docker/docker-compose.test.yml run test-nss-pqc
#   docker compose -f docker/docker-compose.test.yml run test-opencryptoki
#   docker compose -f docker/docker-compose.test.yml run test-tpm2
#   docker compose -f docker/docker-compose.test.yml run test-bouncyhsm
#   docker compose -f docker/docker-compose.test.yml run test-pkcs11-mock
#   docker compose -f docker/docker-compose.test.yml run test-qryptotoken

services:
  # --- Software PKCS#11 tokens ---

  test-softhsm2:
    build:
      context: ..
      dockerfile: docker/softhsm2/Dockerfile
    environment:
      - P11TEST_PIN=1234

  test-kryoptic:
    build:
      context: ..
      dockerfile: docker/kryoptic/Dockerfile
    environment:
      - P11TEST_PIN=1234

  # NSS stable (Fedora 43) — well-tested, v3.0
  test-nss:
    build:
      context: ..
      dockerfile: docker/nss-softoken/Dockerfile

  # NSS bleeding edge (Fedora Rawhide) — v3.2 PQC: ML-KEM, ML-DSA
  test-nss-pqc:
    build:
      context: ..
      dockerfile: docker/nss-softoken/Dockerfile.rawhide

  # --- Additional implementations ---

  # OpenCryptoki SWToken (IBM's PKCS#11, OpenSSL backend)
  # Requires pkcsslotd daemon; started in CMD, not at build time.
  test-opencryptoki:
    build:
      context: ..
      dockerfile: docker/opencryptoki/Dockerfile

  # tpm2-pkcs11 with swtpm (software TPM emulator)
  # swtpm socket server started in CMD; token init via tpm2_ptool.
  test-tpm2:
    build:
      context: ..
      dockerfile: docker/tpm2-pkcs11/Dockerfile

  # BouncyHSM (.NET/BouncyCastle backend, v3.2, PQC)
  test-bouncyhsm:
    build:
      context: ..
      dockerfile: docker/bouncyhsm/Dockerfile

  # pkcs11-mock — minimal PKCS#11 v3.1 stub (no token init needed)
  # Good for testing graceful handling of CKR_FUNCTION_NOT_SUPPORTED.
  test-pkcs11-mock:
    build:
      context: ..
      dockerfile: docker/pkcs11-mock/Dockerfile

  # qryptotoken — experimental pure-Rust PQC PKCS#11 token (QUBIP project)
  # Build may fail; CMD exits gracefully if .so is not produced.
  test-qryptotoken:
    build:
      context: ..
      dockerfile: docker/qryptotoken/Dockerfile
