[project]
name = "pkcs11-check"
description = "Broad, vendor-neutral PKCS#11 behavior & conformance test client (software tokens, HSMs, smart cards, cloud KMS)"
readme = "README.md"
authors = [
    { name = "Denis Mingulov", email = "denis@mingulov.com" }
]
requires-python = ">=3.12"
dynamic = ["version"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "THIRD_PARTY_LICENSES.md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings[toml]>=2.0",
    "psutil>=5.9",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "asn1crypto>=1.5",
    "cryptography>=49.0.0",
    "pytest-reportlog>=1.0.0",
    "hypothesis>=6.100",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "mypy",
    "pyyaml",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/mingulov/pkcs11-check"
Repository = "https://github.com/mingulov/pkcs11-check"
Documentation = "https://github.com/mingulov/pkcs11-check/tree/main/docs"
Issues = "https://github.com/mingulov/pkcs11-check/issues"

[project.scripts]
pkcs11-check = "pkcs11_check.cli.app:main"
pkcs11-check-report = "pkcs11_check.report.__main__:main"

[project.entry-points."pytest11"]
pkcs11-check = "pkcs11_check.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pkcs11_check/__init__.py"

[tool.hatch.build]
exclude = [
    "/data/",
    "artifacts/",
    "/artifacts.zip",
    "/*.zip",
    ".worktrees/",
    ".claude/",
    ".serena/",
    ".github/",
    "AGENTS.md",
    "CLAUDE.md",
    # The PKCS#11 header is a dev-time codegen input only (see
    # scripts/generate_raw_standard.py); the shipped ctypes bindings are
    # generated from it. Keep it in the repo but do not ship it in the sdist
    # or wheel - end users never need it.
    "/third_party/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pkcs11_check"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "src/pkcs11_check/testcases/data/",
    "src/pkcs11_check/raw/metadata_std.py",
    "src/pkcs11_check/raw/types_std.py",
    "tests/data/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/pkcs11_check/raw/api.py" = ["F405"]
"tests/test_classification_*.py" = ["N812"]  # classification imported as C is intentional
"tests/test_helper_*.py" = ["N812"]  # classification imported as C is intentional
"tests/test_assert_ckr_emits.py" = ["N812"]  # classification imported as C is intentional
"tests/test_assert_correct.py" = ["N812"]  # classification imported as C is intentional
"tests/test_undeclared_capability_reason.py" = ["N812"]  # classification imported as C is intentional
"src/pkcs11_check/testcases/conftest.py" = ["N812"]  # classification imported as C is intentional
"src/pkcs11_check/testcases/ckr/_ckr_spec.py" = ["N812"]  # classification imported as C is intentional
"tests/test_provenance.py" = ["N812"]  # provenance imported as P is intentional
"tests/test_vector_reproducer_fixture.py" = ["N812"]  # classification imported as C is intentional
"tests/test_ec_import_classification.py" = ["N812"]  # classification imported as C is intentional

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pkcs11_check"]
mypy_path = "src"
exclude = ["pkcs11_check/testcases/data/"]

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pkcs11_check.testcases.data.*"]
ignore_errors = true

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Linux"
reportMissingImports = false
reportAttributeAccessIssue = false
reportArgumentType = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
timeout = 300
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest-benchmark>=5.2.3",
]
