[project]
name = "p11test"
version = "0.1.0"
description = "CLI-first PKCS#11 test suite with segfault survival, interface forcing, and pytest plugin"
readme = "README.md"
authors = [
    { name = "Denis Mingulov", email = "denis@mingulov.com" }
]
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "python-pkcs11>=0.9.3",
    "typer>=0.15",
    "rich>=13.0",
    "pydantic-settings[toml]>=2.0",
    "psutil>=5.9",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "cryptography>=46.0.5",
    "pytest-json-report>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/mingulov/p11test"
Repository = "https://github.com/mingulov/p11test"
Documentation = "https://github.com/mingulov/p11test/tree/main/docs"
Issues = "https://github.com/mingulov/p11test/issues"

[project.scripts]
p11test = "p11test.cli.app:main"

[project.entry-points."pytest11"]
p11test = "p11test.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p11test"]

[tool.uv.sources]
python-pkcs11 = { path = "python-pkcs11", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/p11test/testcases/vectors/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["p11test"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pkcs11", "pkcs11.*", "psutil"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["p11test.testcases.vectors.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
timeout = 300

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "pytest-benchmark>=5.2.3",
]
